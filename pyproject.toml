[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sollabdata"
version = "0.0.1"
# authors credits everyone whose code is in the package; maintainers is who to contact
# about it now.
authors = [
  { name="Robert Gipson", email="rrgipson@stanford.edu" },
  { name="Eleanor Dunietz" },
]
maintainers = [
  { name="Robert Gipson", email="rrgipson@stanford.edu" },
]
description = "A package for interacting with data from Solomon Lab Instruments"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "matplotlib>=3.4",
    "plotly>=5.0",
    "tabulate>=0.8.9",  # required by info_df.to_markdown(), used in LabData.to_md
    "scipy>=1.7",       # least_squares/quad for the AbsCD and MCD fitting routines
    "cclib>=1.7",       # unit conversion (convertor) in the DFT class
    # NOTE: sollabdata only reads cclib-generated json, and only needs `convertor` from
    # the standard release. Generating that json from raw ORCA/Gaussian output is a
    # separate upstream step -- if it must parse frozen-coordinate bond/angle/dihedral
    # blocks, do it with RG's cclib fork rather than this pinned release.
]

[project.optional-dependencies]
# Extras for working in notebooks: `pip install -e ".[notebook]"`.
# Only IPython, which to_md() targets via IPython.display.Markdown. Jupyter itself is
# deliberately not listed -- it is usually already installed (and better installed by
# conda than pulled in by pip alongside a conda environment).
notebook = ["ipython"]
# Extras for running the test suite: `pip install -e ".[dev]"`
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/rrgipson/sollabdata"

# Explicit src-layout discovery. setuptools would auto-detect this, but stating it
# avoids surprises if stray top-level directories are added later.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pytest` with no arguments, run from the repo root, finds the suite.
testpaths = ["tests"]
# Show local variables in tracebacks and treat unregistered marks as errors, so a
# typo'd @pytest.mark.foo fails loudly instead of being silently ignored.
addopts = "--showlocals --strict-markers"

# Written by RG (Robert Gipson). Claude (Opus 5) added the runtime `dependencies`
# list (previously absent, so installs pulled in nothing), the `notebook` and `dev`
# extras, the [tool.pytest.ini_options] section, and the explicit
# [tool.setuptools.packages.find] src-layout section.